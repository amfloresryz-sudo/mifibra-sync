name: Sincronizar ScordSoft

# Horario (hora de Lima): primera actualización a las 8:00 a. m. y luego cada 20 minutos exactos hasta las 12:00 a. m.
# Turno en paralelo: el reporte siguiente se pide a ScordSoft mientras se procesa el anterior (ver el paso de abajo).
#   8:00, 8:20, 8:40 … 23:20, 23:40 y 0:00.
# El horario de GitHub (cron) se retrasa o se salta corridas, así que cada turno se queda despierto ~5 h 30 min y
# actualiza en cada :00, :20 y :40. Hay 4 turnos al día (GitHub llega a atrasar el arranque 40 min o más); cada uno
# se programa antes de que termine el anterior y espera
# en cola (concurrency) hasta que el otro termina, así no quedan huecos aunque GitHub se atrase.
# Cada actualización descarga UN reporte: Filial SELECCIONE, por Registro.
#   · COMPLETA (1 cada 2 horas, cada hora del día 1 al 5 del mes, y la primera de cada turno): del 1 del mes
#     anterior al fin del mes en curso (~22-27 min).
#   · RÁPIDA (las demás): solo el mes en curso (~14-17 min). Se junta con la última completa, así el portal
#     siempre tiene los 2 meses; las órdenes del mes anterior se refrescan como máximo cada 2 horas (cada hora a inicio de mes).
# CADENA: al terminar, cada turno lanza el siguiente (workflow_dispatch). Fuera de horario el turno espera
#   dormido y se vuelve a encadenar, así el de las 8:00 ya está despierto aunque el cron de GitHub se salte.
#   El cron de abajo queda solo de respaldo por si la cadena se corta.
on:
  schedule:
    - cron: "17 0-4,12-23 * * *"   # cada hora a los :17, de 7:17 a. m. a 11:17 p. m. (Lima). Si hay un turno corriendo, este espera en cola y lo releva; si un turno no arrancó o se cortó, el siguiente lo reemplaza
  workflow_dispatch:
    inputs:
      modo:
        description: "una (una actualización ahora), turno (cada 20 min durante ~5 h 30 min), reescribir (reescribe todas las órdenes) o comentarios (solo escribe en ScordSoft los comentarios de EECC pendientes)"
        default: "una"
        type: choice
        options: [una, turno, reescribir, comentarios]

permissions:
  contents: read
  actions: write   # para que cada turno pueda lanzar el siguiente

concurrency:
  group: sincronizar-scordsoft
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-24.04   # fijo: «ubuntu-latest» pasó a Ubuntu 26 y falla al instalar el navegador
    timeout-minutes: 350   # un turno dura como máximo ~5 h 30 min (límite de GitHub: 6 h)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          # El navegador del robot se baja del CDN de Playwright (no depende de los repositorios de Ubuntu); 3 intentos.
          for i in 1 2 3; do
            python -m playwright install chromium && break
            [ "$i" = 3 ] && exit 1
            echo "Reintento $i de la descarga del navegador en 20 s…"; sleep 20
          done
          # Librerías y fuentes del sistema: el servidor de GitHub ya trae lo que Chromium necesita. Se intenta completar
          # con apt, pero si los repositorios de Ubuntu no responden (pasó el 11-nov) se sigue sin frenar el turno.
          timeout 180 python -m playwright install-deps chromium || echo "Aviso: no se instalaron las librerías extra (apt no respondió); se sigue."

      # Huellas de las órdenes ya guardadas: así cada corrida escribe en Supabase solo lo que cambió.
      - name: Recuperar estado del robot
        uses: actions/cache/restore@v4
        with:
          path: .estado
          key: robot-estado-${{ github.run_id }}
          restore-keys: robot-estado-

      - name: Descargar, procesar y guardar
        env:
          SCORDSOFT_URL: ${{ vars.SCORDSOFT_URL || 'https://mifibra.scordsoft.net' }}
          SCORDSOFT_USUARIO: ${{ secrets.SCORDSOFT_USUARIO }}
          SCORDSOFT_CLAVE: ${{ secrets.SCORDSOFT_CLAVE }}
          SCORDSOFT_TOTP_SECRETO: ${{ secrets.SCORDSOFT_TOTP_SECRETO }}
          SCORDSOFT2_USUARIO: ${{ secrets.SCORDSOFT2_USUARIO }}
          SCORDSOFT2_CLAVE: ${{ secrets.SCORDSOFT2_CLAVE }}
          SCORDSOFT2_TOTP_SECRETO: ${{ secrets.SCORDSOFT2_TOTP_SECRETO }}
          SCORDSOFT_SEL_USUARIO: ${{ vars.SCORDSOFT_SEL_USUARIO }}
          SCORDSOFT_SEL_CLAVE: ${{ vars.SCORDSOFT_SEL_CLAVE }}
          SCORDSOFT_SEL_INGRESAR: ${{ vars.SCORDSOFT_SEL_INGRESAR }}
          SCORDSOFT_SEL_CODIGO: ${{ vars.SCORDSOFT_SEL_CODIGO }}
          SCORDSOFT_SEL_VERIFICAR: ${{ vars.SCORDSOFT_SEL_VERIFICAR }}
          CAJAS_MAPAS: ${{ vars.CAJAS_MAPAS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODO: ${{ github.event_name == 'workflow_dispatch' && inputs.modo || 'turno' }}
        run: |
          case "$MODO" in
            una)        python -m sync.main; exit $? ;;
            reescribir) python -m sync.main --reescribir-todo; exit $? ;;
            comentarios) python -m sync.comentarios_scord; exit $? ;;
          esac
          # Turno EN PARALELO: en cada :00, :20 y :40 de Lima se PIDE el reporte a ScordSoft (lo más lento, ~14 min)
          # mientras se procesa el anterior. Así arranca una actualización cada 20 min exactos y cada una llega al
          # portal ~21 min después de pedirla. Nunca hay dos descargas a la vez (si una tarda más de 20 min, esa marca
          # se salta). Los reportes se procesan de a uno y en orden; si se juntan dos, solo se procesa el más nuevo.
          set -u
          COLA=cola; mkdir -p "$COLA"; rm -f "$COLA"/*
          # La última descarga COMPLETA se guarda con el estado del robot (caché de GitHub): así un turno nuevo arranca
          # de frente con la rápida y no depende de la descarga grande.
          BASE=.estado/base; mkdir -p "$BASE"
          ini_turno=$(date +%s); fin=$(( ini_turno + 320*60 ))   # ya no se piden reportes después de ~5 h 20 min
          en_horario() {   # 8:00–23:59, la de las 0:00 (hasta 0:15 si GitHub se atrasó) y la completa de las 6:00
            local h m; h=$((10#$(TZ=America/Lima date +%H))); m=$((10#$(TZ=America/Lima date +%M)))
            [ "$h" -ge 8 ] || { [ "$h" -eq 0 ] && [ "$m" -lt 15 ]; } || { [ "$h" -eq 6 ] && [ "$m" -lt 10 ]; }
          }
          hora_completa() {   # la descarga COMPLETA (mes anterior + mes en curso) va a las 6:00, 12:00 y 17:00
            local h m; h=$((10#$(TZ=America/Lima date +%H))); m=$((10#$(TZ=America/Lima date +%M)))
            { [ "$h" -eq 6 ] || [ "$h" -eq 12 ] || [ "$h" -eq 17 ]; } && [ "$m" -lt 10 ]
          }
          mes_lima() { TZ=America/Lima date +%Y-%m; }
          base_vigente() {   # carpeta de la última descarga completa, si es de este mes y de las últimas 14 h
            # (la rápida trae los últimos 45 días: la completa solo hace falta para lo más viejo del mes anterior)
            local b lim=840; b=$(ls -d "$BASE"/*/ 2>/dev/null | sort | tail -1 || true)
            [ -n "$b" ] && [ "$(cat "$b/periodo" 2>/dev/null)" = "$(mes_lima)" ] \
              && [ $(( $(date +%s) - $(cat "$b/ts" 2>/dev/null || echo 0) )) -lt $((lim*60)) ] && echo "${b%/}"
          }
          ultima_base() { local b; b=$(ls -d "$BASE"/*/ 2>/dev/null | sort | tail -1 || true); [ -n "$b" ] && echo "${b%/}"; }
          descargar() {   # $1 = marca, $2 = hora ISO del pedido, $3 = hh:mm, $4 = completa|rapida, $5 = epoch del pedido
            set -o pipefail
            local extra=""; [ "$4" = rapida ] && extra="--solo-mes-actual"
            # Tope de 30 min por descarga: si ScordSoft se cuelga, se corta y se pide de nuevo en la siguiente marca.
            if timeout 1800 python -u -m sync.main --solo-descargar "$COLA/$1.tmp.xlsx" $extra 2>&1 | sed -u "s/^/[descarga $3] /" | tee "$COLA/$1.log"; then
              if [ "$4" = completa ]; then   # se guarda como base para las rápidas de la próxima hora
                snap="$BASE/$1"; mkdir -p "$snap"; cp "$COLA/$1.tmp.xlsx" "$snap/0.xlsx"
                for p in "$COLA/partes/$1"_*.xlsx; do [ -e "$p" ] && cp "$p" "$snap/"; done
                mes_lima > "$snap/periodo"; echo "$5" > "$snap/ts"
                ls -d "$BASE"/*/ | sort | head -n -2 | xargs -r rm -rf   # se guardan solo las 2 últimas
              else
                b=$(ultima_base || true); echo "$b" > "$COLA/$1.base"
              fi
              mv "$COLA/$1.tmp.xlsx" "$COLA/$1.xlsx"; echo "$2" > "$COLA/$1.corte"; echo 0 > "$COLA/ult_descarga"
            else
              rm -f "$COLA/$1.tmp.xlsx" "$COLA/partes/$1"_*.xlsx "$COLA/$1".ejec*.xlsx
              # 2 = no pudo iniciar sesión (clave cambiada o cuenta frenada): no se reintenta seguido para no bloquearla
              if grep -q "iniciar sesión" "$COLA/$1.log" 2>/dev/null; then echo 2 > "$COLA/ult_descarga"; else echo 1 > "$COLA/ult_descarga"; fi
            fi
            rm -f "$COLA/descargando" "$COLA/$1.log"
          }
          procesador() {   # procesa los reportes descargados, de a uno; termina cuando ve la marca FIN y no queda nada
            set -o pipefail
            local fallas=0
            while :; do
              # Solo reportes completos «AAAAMMDDhhmmss.xlsx» (nunca los que aún se descargan)
              ultimo=$(ls "$COLA"/*.xlsx 2>/dev/null | grep -E '/[0-9]{14}\.xlsx$' | sort | tail -1 || true)
              if [ -n "$ultimo" ]; then
                for viejo in $(ls "$COLA"/*.xlsx 2>/dev/null | grep -E '/[0-9]{14}\.xlsx$' | sort | head -n -1); do
                  echo "Se salta el reporte $(basename "$viejo") (ya hay uno más nuevo)."; rm -f "$viejo" "${viejo%.xlsx}.corte" "${viejo%.xlsx}.base" "${viejo%.xlsx}".ejec*.xlsx "$COLA/partes/$(basename "${viejo%.xlsx}")"_*.xlsx
                done
                corte=$(cat "${ultimo%.xlsx}.corte"); h=$(TZ=America/Lima date -d "$corte" +%H:%M)
                echo "::group::Actualización $(TZ=America/Lima date -d "$corte" '+%d/%m %H:%M') (hora de Lima) · procesando"
                partes=$(ls "$COLA/partes/$(basename "${ultimo%.xlsx}")"_*.xlsx 2>/dev/null || true)
                [ -n "$partes" ] && echo "El reporte llegó en partes (ScordSoft entregó las filiales por separado): se juntan $(echo $partes | wc -w) archivos más."
                base_arch=""
                if [ -e "${ultimo%.xlsx}.base" ]; then   # rápida: SIEMPRE se junta con la última completa
                  snap=$(cat "${ultimo%.xlsx}.base"); base_arch=$(ls "$snap"/*.xlsx 2>/dev/null || true)
                  if [ -z "$base_arch" ]; then
                    echo "Rápida sin descarga completa de base: se salta (nunca se guarda un reporte a medias)."
                    echo "::endgroup::"; rm -f "$ultimo" "${ultimo%.xlsx}.corte" "${ultimo%.xlsx}.base" $partes; continue
                  fi
                  echo "Actualización RÁPIDA: mes en curso nuevo + mes anterior de la completa de las $(TZ=America/Lima date -d "@$(cat "$snap/ts")" +%H:%M)."
                fi
                marca_p=$(basename "${ultimo%.xlsx}"); parche=""
                ejec=$(ls "${ultimo%.xlsx}".ejec*.xlsx 2>/dev/null || true)   # rápida: lo ejecutado hoy, encima como parche
                # Si ya se aplicó un exprés MÁS NUEVO que este reporte, se vuelve a aplicar: así el portal nunca retrocede.
                if [ -e "$COLA/ult_exp/marca" ] && [ "$(cat "$COLA/ult_exp/marca")" \> "$marca_p" ]; then
                  parche=$(ls "$COLA"/ult_exp/*.xlsx 2>/dev/null || true)
                  [ -n "$parche" ] && echo "Se aplica encima el exprés de las $(TZ=America/Lima date -d "$(cat "$COLA/ult_exp/corte")" +%H:%M) (más nuevo que este reporte)."
                fi
                parche=$(echo $parche $ejec)
                if python -u -m sync.main --excel "$ultimo" $partes ${base_arch:+--base $base_arch} ${parche:+--parche $parche} --corte "$corte" 2>&1 | sed -u "s/^/[proceso $h] /"; then
                  fallas=0
                  # Se guarda como base del exprés: la base de la rápida (si la hubo) + este reporte y sus partes.
                  rm -rf "$COLA/ult"; mkdir -p "$COLA/ult"; mv "$ultimo" $partes "$COLA/ult/"
                  { for f in $base_arch; do echo "$f"; done; ls "$COLA"/ult/*.xlsx; } > "$COLA/ult/lista"; echo "$marca_p" > "$COLA/ult/marca"
                else fallas=$((fallas+1)); echo "El procesamiento falló ($fallas seguidas)."; fi
                echo "::endgroup::"
                rm -f "$ultimo" "${ultimo%.xlsx}.corte" "${ultimo%.xlsx}.base" $partes $ejec
                [ "$fallas" -ge 3 ] && { echo "3 fallas seguidas al procesar: se corta el turno."; touch "$COLA/ABORTAR"; break; }
              elif [ -e "$COLA/FIN" ]; then break
              elif exp=$(ls -d "$COLA"/exp/[0-9]*/ 2>/dev/null | sort | tail -1) && [ -n "$exp" ] && [ -e "$COLA/ult/lista" ]; then
                # EXPRÉS: solo cuando no hay reporte principal esperando, y nunca si la descarga principal ya va
                # por más de 9 min (estaría por llegar: el exprés no la debe atrasar).
                exp=${exp%/}; me=$(basename "$exp")
                for viejo in $(ls -d "$COLA"/exp/[0-9]*/ 2>/dev/null | sort | head -n -1); do rm -rf "$viejo"; done
                if [ -e "$COLA/descargando" ] && [ $(( $(date +%s) - $(stat -c %Y "$COLA/descargando") )) -gt 240 ]; then sleep 10; continue; fi
                if [ ! "$me" \> "$(cat "$COLA/ult/marca")" ]; then rm -rf "$exp"; continue; fi   # más viejo que la última principal
                corte=$(cat "$exp/corte"); h=$(TZ=America/Lima date -d "$corte" +%H:%M)
                echo "::group::Exprés $(TZ=America/Lima date -d "$corte" '+%d/%m %H:%M') (hora de Lima) · procesando"
                if python -u -m sync.main --base $(cat "$COLA/ult/lista") --parche "$exp"/*.xlsx --corte "$corte" 2>&1 | sed -u "s/^/[exprés proceso $h] /"; then
                  rm -rf "$COLA/ult_exp"; mv "$exp" "$COLA/ult_exp"; echo "$me" > "$COLA/ult_exp/marca"
                else echo "El exprés de las $h no se pudo procesar (el robot principal sigue igual)."; rm -rf "$exp"; fi
                echo "::endgroup::"
              else sleep 10; fi
            done
          }
          expres() {   # ROBOT EXPRÉS (2.º usuario de ScordSoft): en :05, :15, :25… trae lo de hoy en ~2 min.
            # Usa OTRO usuario: ScordSoft guarda un solo archivo de reporte por usuario y con el mismo se cruzaban.
            # Si falla 2 veces seguidas (o no puede iniciar sesión) se apaga en este turno; el robot principal sigue igual.
            local fallas=0 log
            mkdir -p "$COLA/exp"
            while :; do
              ahora=$(date +%s); prox=$(( (ahora/300 + 1) * 300 )); [ "$prox" -ge "$fin" ] && break
              sleep $(( prox - ahora ))
              [ -e "$COLA/FIN" ] || [ -e "$COLA/ABORTAR" ] && break
              m=$((10#$(TZ=America/Lima date +%M))); hh=$((10#$(TZ=America/Lima date +%H)))
              [ $((m % 10)) -eq 0 ] && continue          # :00, :10, :20… son del robot principal
              [ "$hh" -ge 8 ] || continue                 # 8:05 a 23:55
              [ -e "$COLA/ult/lista" ] || continue        # aún no hay una actualización principal de base
              marca=$(date +%Y%m%d%H%M%S); corte=$(date -u +%Y-%m-%dT%H:%M:%S+00:00); hm=$(TZ=America/Lima date +%H:%M)
              d="$COLA/exp_tmp/$marca"; mkdir -p "$d"; log="$d.log"
              if SCORDSOFT_USUARIO="$SCORDSOFT2_USUARIO" SCORDSOFT_CLAVE="$SCORDSOFT2_CLAVE" SCORDSOFT_TOTP_SECRETO="$SCORDSOFT2_TOTP_SECRETO" \
                 timeout 480 python -u -m sync.main --solo-descargar-expres "$d" > "$log" 2>&1; then
                sed "s/^/[exprés $hm] /" "$log"; echo "$corte" > "$d/corte"; mv "$d" "$COLA/exp/$marca"; fallas=0
              else
                sed "s/^/[exprés $hm] /" "$log"; rm -rf "$d"; fallas=$((fallas+1))
                if grep -q "iniciar sesión" "$log"; then echo "[exprés] no pudo iniciar sesión: se apaga en este turno para no bloquear la cuenta."; break; fi
                [ "$fallas" -ge 2 ] && { echo "[exprés] 2 fallas seguidas: se apaga en este turno (el robot principal sigue)."; break; }
              fi
              rm -f "$log"
            done
          }
          procesador & pid_proc=$!
          # El exprés solo corre con un SEGUNDO usuario de ScordSoft (secreto SCORDSOFT2_USUARIO); sin él queda apagado.
          pid_exp=""
          if [ -n "$SCORDSOFT2_USUARIO" ] && [ "$SCORDSOFT2_USUARIO" != "$SCORDSOFT_USUARIO" ]; then expres & pid_exp=$!
          else echo "Exprés apagado: falta un segundo usuario de ScordSoft (SCORDSOFT2_USUARIO)."; fi
          # Comentarios de las EECC («Mis pendientes») → ScordSoft (Agendamiento de Ordenes · ING. VISITA): mira Supabase
          # cada minuto y solo abre ScordSoft cuando hay alguno por escribir. Corre aparte: no frena las descargas.
          ( python -u -m sync.comentarios_scord --vigilar 325 2>&1 | sed -u "s/^/[comentarios] /" ) & pid_com=$!
          # Fichas B2B (web B2B): cada 10 min mira en Supabase si hay abonados B2B con instalación o avería REGISTRADA sin
          # datos de contacto; solo entonces abre su ficha en ScordSoft (Consultar, solo lectura) y guarda nombre, celular y
          # dirección en la tabla protegida b2b_scord_clientes. Nunca escribe esos datos en este registro.
          ( python -u -m sync.fichas_b2b --vigilar 325 2>&1 | sed -u "s/^/[fichas B2B] /" ) & pid_fic=$!
          pid_desc=""; errores=0; pausa_hasta=0
          while :; do
            [ -e "$COLA/ABORTAR" ] && break
            ahora=$(date +%s); [ "$ahora" -ge "$fin" ] && break
            h=$((10#$(TZ=America/Lima date +%H)))
            if en_horario; then
              if [ -e "$COLA/descargando" ]; then
                echo "$(TZ=America/Lima date +%H:%M): la descarga anterior sigue en curso; esta marca se salta."
              else
                if [ -n "$pid_desc" ]; then
                  wait "$pid_desc" || true; pid_desc=""
                  ud=$(cat "$COLA/ult_descarga" 2>/dev/null || echo 1)
                  if [ "$ud" = "0" ]; then errores=0
                  elif [ "$ud" = "2" ]; then
                    pausa_hasta=$(( $(date +%s) + 3600 ))
                    echo "No se pudo iniciar sesión en ScordSoft: se espera 1 hora antes de volver a intentar (para no bloquear la cuenta). Revisa la clave del robot."
                  else errores=$((errores+1)); echo "La descarga falló ($errores seguidas): se vuelve a pedir en la siguiente marca."; fi
                fi
                if [ "$(date +%s)" -lt "$pausa_hasta" ]; then
                  echo "$(TZ=America/Lima date +%H:%M): en pausa por el inicio de sesión fallido; esta marca se salta."
                  ahora=$(date +%s); prox=$(( (ahora/600 + 1) * 600 )); [ "$prox" -ge "$fin" ] && break; sleep $(( prox - ahora )); continue
                fi
                marca=$(date +%Y%m%d%H%M%S); corte=$(date -u +%Y-%m-%dT%H:%M:%S+00:00); hm=$(TZ=America/Lima date +%H:%M)
                if [ -n "$(base_vigente || true)" ] && ! hora_completa; then tipo=rapida; else tipo=completa; fi
                echo "$hm: se pide el reporte a ScordSoft ($tipo)."
                touch "$COLA/descargando"; descargar "$marca" "$corte" "$hm" "$tipo" "$(date +%s)" & pid_desc=$!
              fi
              [ "$h" -eq 0 ] && { echo "Última actualización del día (0:00) pedida."; break; }
            fi   # fuera de horario: el turno espera dormido (y al final encadena el siguiente) hasta las 8:00
            # Siguiente marca :00, :10, :20… (exacta: se mide desde el reloj, no desde que terminó la anterior)
            ahora=$(date +%s); prox=$(( (ahora/600 + 1) * 600 ))
            [ "$prox" -ge "$fin" ] && break
            sleep $(( prox - ahora ))
          done
          # Cierre: se espera la descarga en curso, se procesa lo que quede y termina el procesador.
          [ -n "$pid_desc" ] && { wait "$pid_desc" || true; }
          touch "$COLA/FIN"; wait "$pid_proc" || true
          kill "$pid_com" "$pid_fic" ${pid_exp:+"$pid_exp"} 2>/dev/null || true
          [ -e "$COLA/ABORTAR" ] && exit 1
          exit 0

      # Cadena: cada turno lanza el siguiente (queda en cola y arranca apenas este termina). Así no depende
      # del cron de GitHub, que hoy se salta o atrasa turnos. Si cancelas el run a mano, la cadena se detiene
      # (vuelve con el cron de respaldo o lanzando «turno» a mano).
      - name: Encadenar el siguiente turno
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.modo == 'turno') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sincronizar.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f modo=turno

      - name: Guardar estado del robot
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .estado
          key: robot-estado-${{ github.run_id }}-${{ github.run_attempt }}
