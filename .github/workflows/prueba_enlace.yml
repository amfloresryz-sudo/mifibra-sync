name: Prueba enlace Control Operativo (no escribe)
# PRUEBA de solo lectura: abrir con un navegador la página publicada del Control Operativo y ver si sus datos (cifrados) se pueden leer.
on:
  push:
    branches: [prueba-st-enlace]
    paths: [".github/workflows/prueba_enlace.yml"]
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1 && echo listo
      - run: |
          cat > p.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch(); const p = await b.newPage();
          const reqs = []; p.on('request', r => { const u = r.url(); if (!/assets-proxy|\.woff2|\.png|\.svg/.test(u)) reqs.push(r.method() + ' ' + u.slice(0, 160)); });
          await p.goto('https://claude.ai/artifact/LPovdENFQxf1WjiuvVrByY', { waitUntil: 'networkidle', timeout: 60000 }).catch(e => console.log('goto', e.message));
          await p.waitForTimeout(8000);
          console.log('PETICIONES:'); reqs.slice(0, 40).forEach(x => console.log('  ' + x));
          for (const f of p.frames()) {
            let info = {};
            try { info = await f.evaluate(() => ({ t: document.title, n: document.documentElement.outerHTML.length, enc: typeof ENC !== 'undefined' ? Object.keys(ENC) : null, txt: document.body ? document.body.innerText.slice(0, 200) : '' })); } catch (e) { info = { err: e.message.slice(0, 120) }; }
            console.log('FRAME', f.url().slice(0, 160), JSON.stringify(info));
          }
          await b.close();
          JS
          node p.mjs
